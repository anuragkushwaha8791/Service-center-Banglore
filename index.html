const PALL={battery:false,charger:false};
const OF={loc:"",cat:"",st:"",from:"",to:"",q:"",pre:"",len:3};
const CATL={battery:"🔋 Battery",charger:"⚡ Charger"};
const serialOf=p=>String(p.batterySrNo||p.assetSrNo||p.serialNo||"").trim();
const prefOf=(sr,n)=>{const s=String(sr||"").replace(/\s+/g,"").toUpperCase();return s?s.slice(0,n):"(no serial)"};
const catOf=k=>isBat(k)?"battery":"charger";
const stOf=p=>isFail(p)?"f":isOk(p)?"o":"p";
const ecls=v=>v>=70?"lo":v>=40?"mid":"hi";
const agg=a=>{const n=a.length,f=a.filter(x=>x.st==="f").length,o=a.filter(x=>x.st==="o").length;return {n,f,o,p:n-f-o}};
function ovRows(){const out=[],q=OF.q.toLowerCase(),pre=OF.pre.replace(/\s+/g,"").toUpperCase();
 for(const l of visLocs()){if(OF.loc&&OF.loc!==l.id)continue;
  for(const k of l.mods){const cat=catOf(k);if(OF.cat&&OF.cat!==cat)continue;
   for(const p of S[k].rows){const d=ymd(p);if(OF.from&&d<OF.from)continue;if(OF.to&&d>OF.to)continue;
    const st=stOf(p);if(OF.st&&OF.st!==st)continue;const sr=serialOf(p);
    if(pre&&!sr.replace(/\s+/g,"").toUpperCase().startsWith(pre))continue;
    if(q&&!sr.toLowerCase().includes(q))continue;
    out.push({p,k,loc:l.id,cat,sr,st,pf:prefOf(sr,OF.len)})}}}
 return out}
async function ovLoad(full){if(ovBusy)return;ovBusy=true;render();
 try{for(const l of visLocs())for(const k of l.mods){if(!S[k].loaded)await loadMod(k,false,FETCH);
   if(full)while(S[k].loaded&&S[k].more){const b=S[k].rows.length;await loadMod(k,true,FETCH);if(S[k].rows.length===b)break}}}
 finally{ovBusy=false;render()}}
function modeBar(){return `<div class="seg"><button class="${dtab==="loc"?"on":""}" data-a="dtab" data-i="loc">📍 Location Dashboard</button><button class="${dtab==="all"?"on":""}" data-a="dtab" data-i="all">🌐 Overall Analytics · All Locations</button></div>`}
function ovFilters(vl){const sel=(id,l,o,v)=>`<div><label>${l}</label><select data-of="${id}">${o.map(([a,b])=>`<option value="${esc(a)}" ${String(v)===String(a)?"selected":""}>${esc(b)}</option>`).join("")}</select></div>`;
 return `<div class="fgrid">${sel("loc","Location",[["","All locations"],...vl.map(l=>[l.id,l.menu])],OF.loc)}${sel("cat","Type",[["","Battery + Charger"],["battery","Battery only"],["charger","Charger only"]],OF.cat)}${sel("st","Status",[["","All status"],["f","Faulty only"],["o","Resolved only"],["p","Pending / Hold only"]],OF.st)}${sel("len","Group serial by",[1,2,3,4,5,6,7,8].map(n=>[n,"First "+n+" character"+(n>1?"s":"")]),OF.len)}
 <div><label>From date</label><input type="date" data-of="from" value="${esc(OF.from)}"></div><div><label>To date</label><input type="date" data-of="to" value="${esc(OF.to)}"></div>
 <div><label>Serial starts with</label><input data-of="pre" placeholder="e.g. VSC" value="${esc(OF.pre)}"></div><div><label>Serial contains</label><input data-of="q" placeholder="Search serial…" value="${esc(OF.q)}"></div></div>
 <div class="row"><button class="gry" data-a="ovclr">Clear filters</button></div>`}
function pfTable(cat,rows,locs){
 const list=rows.filter(x=>x.cat===cat),g=new Map();
 list.forEach(x=>{let e=g.get(x.pf);if(!e){e={k:x.pf,n:0,f:0,o:0,loc:{}};g.set(x.pf,e)}
  e.n++;if(x.st==="f")e.f++;else if(x.st==="o")e.o++;
  const L=e.loc[x.loc]||(e.loc[x.loc]={n:0,f:0});L.n++;if(x.st==="f")L.f++});
 const arr=[...g.values()].sort((a,b)=>b.n-a.n||a.k.localeCompare(b.k)),N=list.length,mx=Math.max(1,...arr.map(e=>e.n)),show=PALL[cat]?arr:arr.slice(0,15),T=agg(list);
 const lc=(e,id)=>{const L=e.loc[id];return L?`<b>${L.n}</b>${L.f?` <small style="color:#dc2626">(${L.f} faulty)</small>`:""}`:"<span style='color:var(--mut)'>0</span>"};
 const lt=id=>{const z=agg(list.filter(x=>x.loc===id));return `<b>${z.n}</b>${z.f?` <small style="color:#dc2626">(${z.f} faulty)</small>`:""}`};
 return `<div class="sec"><h2>${CATL[cat]} — Serial Number Series (first ${OF.len} characters)</h2>
  <p class="note">${arr.length} different series · ${N} entries. Faulty = Non-Repairable / Scrap / Dead / Not OK / PDI Fail. Use <b>Details</b> for location split, top issues and the faulty serial numbers of that series.</p>
  <div class="tw"><table><thead><tr><th>#</th><th>Starts with</th><th>Total</th><th>Share</th><th></th><th>Resolved</th><th>Faulty</th><th>Pending</th><th>Fault %</th><th>Efficiency</th>${locs.map(l=>`<th>${esc(l.menu)}</th>`).join("")}<th></th></tr></thead><tbody>
  ${show.map((e,i)=>`<tr><td>${i+1}</td><td><b>${esc(e.k)}</b></td><td><b>${e.n}</b></td><td>${pct(e.n,N)}%</td><td style="width:110px"><div class="bar"><i style="width:${pct(e.n,mx)}%"></i></div></td><td style="color:#16a34a;font-weight:700">${e.o}</td><td style="color:#dc2626;font-weight:700">${e.f}</td><td style="color:#d97706;font-weight:700">${e.n-e.o-e.f}</td><td><span class="pf ${fcls(e.f/e.n*100)}">${pct(e.f,e.n)}%</span></td><td>${pct(e.o,e.n)}%</td>${locs.map(l=>`<td>${lc(e,l.id)}</td>`).join("")}<td><button class="gry" data-a="pd" data-i="${esc(cat+"|"+e.k)}">Details</button></td></tr>`).join("")||`<tr><td colspan="${11+locs.length}">No entries match the filters</td></tr>`}
  </tbody>${arr.length?`<tfoot><tr><td></td><td>TOTAL</td><td>${T.n}</td><td>100%</td><td></td><td>${T.o}</td><td>${T.f}</td><td>${T.p}</td><td>${pct(T.f,T.n)}%</td><td>${pct(T.o,T.n)}%</td>${locs.map(l=>`<td>${lt(l.id)}</td>`).join("")}<td></td></tr></tfoot>`:""}</table></div>
  ${arr.length>15?`<div class="row" style="margin-top:10px"><button class="gry" data-a="pall" data-i="${cat}">${PALL[cat]?"Show top 15":"Show all "+arr.length+" series"}</button></div>`:""}</div>`}
function issueTable(cat,rows){const list=rows.filter(x=>x.cat===cat),N=list.length,g=group(list.map(x=>x.p),p=>p.reportedIssue||"").slice(0,12),mx=Math.max(1,...g.map(x=>x.n));
 return `<div class="sec"><h2>${CATL[cat]} — Top Reported Issues (all locations)</h2><div class="tw"><table><thead><tr><th>Issue</th><th>Entries</th><th>Share</th><th></th><th>Resolved</th><th>Faulty</th><th>Fault %</th></tr></thead><tbody>
 ${g.map(x=>`<tr><td class="w">${esc(x.k)}</td><td><b>${x.n}</b></td><td>${pct(x.n,N)}%</td><td style="width:110px"><div class="bar"><i style="width:${pct(x.n,mx)}%"></i></div></td><td>${x.o}</td><td>${x.f}</td><td><span class="pf ${fcls(x.f/x.n*100)}">${pct(x.f,x.n)}%</span></td></tr>`).join("")||"<tr><td colspan=7>No data</td></tr>"}</tbody></table></div></div>`}
function ovDash(){
 const vl=visLocs(),mods=vl.flatMap(l=>l.mods),loaded=mods.filter(k=>S[k].loaded).length,moreK=mods.filter(k=>S[k].more),
  rows=ovRows(),A=agg(rows),Bt=agg(rows.filter(x=>x.cat==="battery")),Ch=agg(rows.filter(x=>x.cat==="charger")),
  locs=vl.filter(l=>!OF.loc||OF.loc===l.id),ef=a=>pct(a.o,a.n),cs=a=>pct(a.o,a.o+a.f);
 const lr=locs.map(l=>{const r=rows.filter(x=>x.loc===l.id);return {l,b:agg(r.filter(x=>x.cat==="battery")),c:agg(r.filter(x=>x.cat==="charger")),t:agg(r)}});
 const eff=a=>a.n?`<span class="pf ${ecls(a.o/a.n*100)}">${ef(a)}%</span>`:"—";
 const cells=a=>`<td>${a.n}</td><td style="color:#16a34a;font-weight:700">${a.o}</td><td style="color:#dc2626;font-weight:700">${a.f}</td><td>${eff(a)}</td>`;
 const tot=(l,b,c,t)=>`<td>${t.n}</td><td style="color:#dc2626;font-weight:700">${t.f}</td><td>${eff(t)}</td><td style="width:110px"><div class="bar"><i style="width:${ef(t)}%;background:#16a34a"></i></div></td>`;
 return `<div class="row"><span style="flex:1;min-width:220px"><b style="font-size:16px;color:var(--acc)">Overall Analytics</b><br><small style="color:var(--mut)">Battery &amp; Charger of every location combined · ${loaded}/${mods.length} sections loaded · ${rows.length} entries after filters</small></span>
  <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label style="margin:0">Data loaded</label><select data-owin="1" style="width:auto;margin:0;min-width:170px">${WINS.map(([d,l])=>`<option value="${d}" ${(WIN[mods[0]]||0)===d?"selected":""}>${l}</option>`).join("")}</select></span>
  <button class="gry" data-a="ovfull">⬇ Load complete data</button><button class="gry" data-a="ref">↻ Refresh</button><button class="grn" data-a="ovex">Export CSV</button><button class="gry" data-a="opr">🖨 Print</button></div>
 ${ovBusy?`<div class="alert">⏳ Loading data from all locations…</div>`:""}
 ${moreK.length&&!ovBusy?`<div class="alert">⚠ ${moreK.length} section(s) have more entries on the server than loaded. Press <b>Load complete data</b> for exact totals.</div>`:""}
 <div class="sec"><h2>Filters</h2>${ovFilters(vl)}<p class="note">All numbers below follow these filters. Efficiency = Resolved ÷ Total entries. Faulty = Repair Status Not OK / Non-Repairable / Scrap / Dead or PDI Fail. Resolved = OK / Repaired / No Issue Found. The rest is Pending / On Hold.</p></div>
 <h3 class="sh">Combined — Battery + Charger, all locations</h3>
 <div class="cards">${kpi("Total Entries",A.n)}${kpi("Resolved",A.o,"g2")}${kpi("Faulty",A.f,"r2")}${kpi("Pending / Hold",A.p,"o2")}${kpi("Overall Efficiency",ef(A)+"%","g2")}${kpi("Failure Rate",pct(A.f,A.n)+"%","r2")}${kpi("Success on Closed Cases",cs(A)+"%","g2")}${kpi("Locations",locs.length)}</div>
 <h3 class="sh">🔋 Battery — all locations</h3>
 <div class="cards">${kpi("Battery Entries",Bt.n)}${kpi("Resolved",Bt.o,"g2")}${kpi("Faulty",Bt.f,"r2")}${kpi("Pending / Hold",Bt.p,"o2")}${kpi("Battery Efficiency",ef(Bt)+"%","g2")}${kpi("Failure Rate",pct(Bt.f,Bt.n)+"%","r2")}</div>
 <h3 class="sh">⚡ Charger — all locations</h3>
 <div class="cards">${kpi("Charger Entries",Ch.n)}${kpi("Resolved",Ch.o,"g2")}${kpi("Faulty",Ch.f,"r2")}${kpi("Pending / Hold",Ch.p,"o2")}${kpi("Charger Efficiency",ef(Ch)+"%","g2")}${kpi("Failure Rate",pct(Ch.f,Ch.n)+"%","r2")}</div>
 <div class="sec"><h2>Overall Efficiency Summary</h2>
  <div class="brow"><span>🔋 Battery (all locations)</span><div class="bar"><i style="width:${ef(Bt)}%;background:#16a34a"></i></div><b>${ef(Bt)}%</b></div>
  <div class="brow"><span>⚡ Charger (all locations)</span><div class="bar"><i style="width:${ef(Ch)}%;background:#16a34a"></i></div><b>${ef(Ch)}%</b></div>
  <div class="brow"><span><b>Combined</b></span><div class="bar"><i style="width:${ef(A)}%;background:#1e4e79"></i></div><b>${ef(A)}%</b></div></div>
 <div class="sec"><h2>📍 Location-wise Efficiency</h2><div class="tw"><table><thead><tr><th rowspan="2">Location</th><th colspan="4" class="grp">🔋 Battery</th><th colspan="4" class="grp">⚡ Charger</th><th colspan="4" class="grp">Combined</th></tr>
  <tr><th>Entries</th><th>Resolved</th><th>Faulty</th><th>Efficiency</th><th>Entries</th><th>Resolved</th><th>Faulty</th><th>Efficiency</th><th>Entries</th><th>Faulty</th><th>Efficiency</th><th></th></tr></thead><tbody>
  ${lr.map(x=>`<tr><td><b>${x.l.ic} ${esc(x.l.menu)}</b></td>${cells(x.b)}${cells(x.c)}${tot(x.l,x.b,x.c,x.t)}</tr>`).join("")||"<tr><td colspan=13>No data</td></tr>"}</tbody>
  <tfoot><tr><td>ALL LOCATIONS</td>${cells(Bt)}${cells(Ch)}${tot(0,Bt,Ch,A)}</tr></tfoot></table></div></div>
 ${(OF.cat!=="charger"?pfTable("battery",rows,locs):"")}${(OF.cat!=="battery"?pfTable("charger",rows,locs):"")}
 ${(OF.cat!=="charger"?issueTable("battery",rows):"")}${(OF.cat!=="battery"?issueTable("charger",rows):"")}`}

Object.assign(H,{
 dtab:i=>{dtab=i;if(i==="all")ovLoad(false);else{ensureDash(dm);render()}},
 ovfull:()=>{if(confirm("This reads EVERY entry of all sections (1 read per entry; Firebase free limit is 50,000 reads per day for the whole team). Continue?"))ovLoad(true)},
 gobk:()=>nav("set"),
 ovclr:()=>{Object.assign(OF,{loc:"",cat:"",st:"",from:"",to:"",q:"",pre:"",len:3});render()},
 pall:i=>{PALL[i]=!PALL[i];render()},
 opr:()=>window.print(),
 ovex:()=>{const rows=ovRows(),locs=visLocs().filter(l=>!OF.loc||OF.loc===l.id),qt=v=>`"${String(v??"").replace(/"/g,'""')}"`,out=[];
  out.push(["Type","Serial starts with","Total","Resolved","Faulty","Pending","Fault %","Efficiency %",...locs.flatMap(l=>[l.menu+" - Total",l.menu+" - Faulty"])].map(qt).join(","));
  for(const cat of ["battery","charger"]){const g=new Map();rows.filter(x=>x.cat===cat).forEach(x=>{if(!g.has(x.pf))g.set(x.pf,[]);g.get(x.pf).push(x)});
   [...g].sort((a,b)=>b[1].length-a[1].length).forEach(([pf,a])=>{const t=agg(a);out.push([cat,pf,t.n,t.o,t.f,t.p,pct(t.f,t.n),pct(t.o,t.n),...locs.flatMap(l=>{const z=agg(a.filter(x=>x.loc===l.id));return [z.n,z.f]})].map(qt).join(","))})}
  dl(["\ufeff"+out.join("\n")],"overall_serial_series_"+today()+".csv","text/csv");toast("Exported");log("Exported overall analytics CSV",rows.length+" entries")},
 pd:i=>{const j=i.indexOf("|"),cat=i.slice(0,j),pf=i.slice(j+1),rows=ovRows().filter(x=>x.cat===cat&&x.pf===pf),T=agg(rows),m=$("#modal"),locs=visLocs().filter(l=>!OF.loc||OF.loc===l.id),
   bad=rows.filter(x=>x.st==="f"),iss=group(rows.map(x=>x.p),p=>p.reportedIssue||"").slice(0,8);
  m.innerHTML=`<div class="box" style="width:780px"><h2 style="color:var(--acc)">${CATL[cat]} · ${esc(pf)}</h2><p class="note">Serial numbers starting with <b>${esc(pf)}</b> (first ${OF.len} characters) · ${T.n} entries · current filters applied</p>
  <div class="cards">${kpi("Total",T.n)}${kpi("Resolved",T.o,"g2")}${kpi("Faulty",T.f,"r2")}${kpi("Pending / Hold",T.p,"o2")}${kpi("Fault %",pct(T.f,T.n)+"%","r2")}${kpi("Efficiency",pct(T.o,T.n)+"%","g2")}</div>
  <h3 class="sh">Location-wise</h3><div class="tw"><table><thead><tr><th>Location</th><th>Entries</th><th>Resolved</th><th>Faulty</th><th>Pending</th><th>Fault %</th></tr></thead><tbody>
  ${locs.map(l=>{const z=agg(rows.filter(x=>x.loc===l.id));return `<tr><td><b>${esc(l.menu)}</b></td><td>${z.n}</td><td>${z.o}</td><td>${z.f}</td><td>${z.p}</td><td>${z.n?`<span class="pf ${fcls(z.f/z.n*100)}">${pct(z.f,z.n)}%</span>`:"—"}</td></tr>`}).join("")}</tbody></table></div>
  <h3 class="sh">Top reported issues</h3><div class="tw"><table><thead><tr><th>Issue</th><th>Entries</th><th>Faulty</th></tr></thead><tbody>${iss.map(x=>`<tr><td class="w">${esc(x.k)}</td><td>${x.n}</td><td>${x.f}</td></tr>`).join("")||"<tr><td colspan=3>No data</td></tr>"}</tbody></table></div>
  <h3 class="sh">Faulty serial numbers (${bad.length})</h3><div>${bad.slice(0,80).map(x=>`<span class="chip" style="padding:4px 12px">${esc(x.sr||"(no serial)")} <small style="color:var(--mut)">${esc(locName(x.loc))}</small></span>`).join("")||"<small style='color:var(--mut)'>No faulty entries</small>"}${bad.length>80?`<small style="color:var(--mut)"> …and ${bad.length-80} more (use Export CSV / Status filter)</small>`:""}</div>
  <div class="row" style="margin-top:14px"><button class="gry" id="pkc">Close</button></div></div>`;
  m.onchange=null;m.oninput=null;m.classList.remove("hide");$("#pkc").onclick=()=>m.classList.add("hide")}
});
function bkWarn(){if(!isOwner())return "";const t=cfg.meta?.lastBackup,d=t?Math.floor((Date.now()-new Date(t))/864e5):null;
 return d===null||d>30?`<div class="alert">🛡 <b>Backup due.</b> ${d===null?"No full backup has been recorded yet.":"Last full backup was "+d+" days ago."} Download a Full Backup (JSON) at least once a month and keep a copy in Google Drive. <button class="gry" data-a="gobk" style="margin-left:8px">Go to Backup</button></div>`:""}
async function markBackup(){const iso=new Date().toISOString();try{await setDoc(doc(db,"config","meta"),{lastBackup:iso,lastBackupBy:me.name},{merge:true});cfg.meta={...(cfg.meta||{}),lastBackup:iso}}catch(_){}}
const dash=()=>bkWarn()+modeBar()+(dtab==="all"?ovDash():dashLoc());

const V=$("#view");
V.onclick=e=>{const b=e.target.closest("[data-a]");if(b&&H[b.dataset.a])H[b.dataset.a](b.dataset.i,b)};
V.onchange=e=>{const t=e.target;
 if(t.dataset.of){OF[t.dataset.of]=t.dataset.of==="len"?+t.value:t.value;render()}
 else if(t.dataset.owin!==undefined){const v=+t.value;for(const k in BASE){WIN[k]=v;try{localStorage.setItem("win_"+k,v)}catch(_){}Object.assign(S[k],{rows:[],cur:null,more:false,loaded:false,full:false});SHOW[k]=20}ovLoad(false)}
 else if(t.dataset.win!==undefined){const k=curMod(),v=+t.value;WIN[k]=v;try{localStorage.setItem("win_"+k,v)}catch(_){}Object.assign(S[k],{rows:[],cur:null,more:false,loaded:false,full:false});SHOW[k]=20;render();loadMod(k,false,k===view?20:FETCH)}
 else if(t.dataset.f){const f=FL[curMod()];f[t.dataset.f]=t.value;if(t.dataset.f==="col")f.val="";render()}
 else if(t.dataset.dim){DIM[dm]=t.value;DALL[dm]=false;render()}
 else if(t.dataset.c==="loc"){updateDoc(doc(db,"users",t.dataset.i),{location:t.value}).then(()=>{const u=users.find(x=>x.id===t.dataset.i);if(u){u.location=t.value;log("Changed location",u.name+" → "+(locMenu(t.value)||"none"))}}).catch(fail)}else if(t.dataset.c==="ro"){updateDoc(doc(db,"users",t.dataset.i),{role:t.value}).then(()=>{const u=users.find(x=>x.id===t.dataset.i);if(u){u.role=t.value;log("Changed role",u.name+" → "+t.value)}}).catch(fail)}};
V.oninput=e=>{const t=e.target;if(t.dataset.of==="q"||t.dataset.of==="pre"){const key=t.dataset.of,p=t.selectionStart;OF[key]=t.value;render();const n=document.querySelector('[data-of="'+key+'"]');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(_){}}return}
 if(t.id==="fq"){FL[curMod()].q=t.value;SHOW[curMod()]=20;const p=t.selectionStart;render();const n=$("#fq");n.focus();n.setSelectionRange(p,p)}};
</script></body></html>
