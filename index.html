async function loadConfig(){for(const [id,key] of [["options","opts"],["fields","custom"],["permissions","perm"]]){try{const s=await getDoc(doc(db,"config",id));cfg[key]=s.exists()?s.data():{}}catch(e){cfg[key]={}}}}
async function loadBase(){try{
  await loadConfig();
  const lq=isAdmin()?query(collection(db,"logs"),limit(LOGMAX+1)):query(collection(db,"logs"),where("uid","==",me.uid),limit(LOGMAX));
  let ls=await getDocs(lq);let arr=ls.docs.map(d=>({id:d.id,...d.data()}));
  if(!isAdmin())arr=arr.filter(x=>x.uid===me.uid);
  if(isAdmin()&&arr.length>LOGMAX){const old=await getDocs(query(collection(db,"logs"),startAfter(ls.docs[LOGMAX-1]),limit(450)));
   if(old.docs.length){const b=writeBatch(db);old.docs.forEach(d=>b.delete(d.ref));await b.commit().catch(()=>{})}arr=arr.slice(0,LOGMAX)}
  logs=arr;
  if(isAdmin())users=(await getDocs(collection(db,"users"))).docs.map(d=>({id:d.id,...d.data()}));
  lastLoad=Date.now();
 }catch(e){fail(e)}}
async function loadMod(k,more,n){const s=S[k],size=n||(more?40:Math.min(Math.max(s.rows.length,20),FETCH));
 try{const qs=await getDocs(query(collection(db,BASE[k].col),...wq(k),...(more&&s.cur?[startAfter(s.cur)]:[]),limit(size)));
  const rows=qs.docs.map(d=>({id:d.id,...d.data()}));s.rows=more?[...s.rows,...rows]:rows;s.cur=qs.docs[qs.docs.length-1]||s.cur;s.more=qs.docs.length===size;s.loaded=true;if(size>=FETCH)s.full=true;lastLoad=Date.now();$("#warn").classList.add("hide")}catch(e){fail(e)}
 render()}
function ensureDash(k){const s=S[k];if(!s.loaded)loadMod(k,false,FETCH);else if(!s.full&&s.more)loadMod(k,true,FETCH)}
async function refreshAll(){if(!me)return;await loadBase();const ks=Object.keys(S).filter(k=>S[k].loaded);for(const k of ks)await loadMod(k);render()}

/* analytics helpers */
function applyF(k,rows,withQ){const f=FL[k],ql=f.q.toLowerCase();
 return rows.filter(p=>{if(withQ&&ql&&!JSON.stringify(p).toLowerCase().includes(ql))return false;if(f.u&&p.createdBy!==f.u)return false;
  const d=ymd(p);if(f.from&&d<f.from)return false;if(f.to&&d>f.to)return false;if(f.col&&f.val&&!asArr(p[f.col]).includes(f.val))return false;return true})}
function group(rows,fn){const m=new Map();rows.forEach(p=>{let r=fn(p);r=Array.isArray(r)?r:[r];if(!r.length)r=[""];const d=ymd(p),bad=isFail(p),good=!bad&&isOk(p);
 new Set(r.map(x=>x||"(blank)")).forEach(key=>{let g=m.get(key);if(!g){g={n:0,f:0,o:0,last:""};m.set(key,g)}g.n++;if(bad)g.f++;else if(good)g.o++;if(d>g.last)g.last=d})});
 return [...m].map(([k,g])=>({k,...g})).sort((a,b)=>b.n-a.n)}
const dimVal=(k,p,key)=>{if(key==="__by")return p.createdByName;const f=fieldsOf(k).find(x=>x[0]===key);if(!f)return"";return f[2]==="multi"?asArr(p[key]):cell(k,p,f)};
const fcls=v=>v>=30?"hi":v>=10?"mid":"lo";
function fbar(k,withQ){const f=FL[k],s=S[k],fl=fieldsOf(k).filter(x=>x[2]==="sel"||x[2]==="multi");
 const people=[...new Map(s.rows.filter(p=>p.createdBy).map(p=>[p.createdBy,p.createdByName||"—"]))];
 const vals=f.col?[...new Set(s.rows.flatMap(p=>asArr(p[f.col])).filter(Boolean))].sort():[];
 return `<div class="row">${withQ?`<input id="fq" placeholder="Search all columns..." value="${esc(f.q)}">`:""}
 <select data-f="u"><option value="">All people</option>${people.map(([id,n])=>`<option value="${esc(id)}" ${f.u===id?"selected":""}>${esc(n)}</option>`).join("")}</select>
 <input type="date" data-f="from" value="${f.from}" title="From date"><input type="date" data-f="to" value="${f.to}" title="To date">
 <select data-f="col"><option value="">Filter by column…</option>${fl.map(x=>`<option value="${x[0]}" ${f.col===x[0]?"selected":""}>${esc(x[1])}</option>`).join("")}</select>
 <select data-f="val" ${f.col?"":"disabled"}><option value="">All values</option>${vals.map(v=>`<option ${f.val===v?"selected":""}>${esc(v)}</option>`).join("")}</select>
 <button class="gry" data-a="clr">Clear filters</button></div>`}
const kpi=(l,v,c="")=>`<div class="c ${c}"><h3>${l}</h3><h2>${v}</h2></div>`;

const PU={mechParts:false,elecParts:false};
function partStats(all,key){const seen=new Set(optsOf("lucknow",key));all.forEach(p=>asArr(p[key]).forEach(x=>seen.add(x)));
 const ct=[...new Set([...optsOf("lucknow","chargerType"),...all.map(p=>p.chargerType).filter(Boolean)])];
 const m=new Map([...seen].map(o=>[o,{k:o,n:0,r:0,h:0,d:0,ct:{}}]));
 all.forEach(p=>{const bad=isFail(p),good=!bad&&isOk(p),hold=!bad&&!good&&/hold/i.test(p.repairStatus||"");
  new Set(asArr(p[key])).forEach(o=>{const g=m.get(o);if(!g)return;g.n++;if(good)g.r++;else if(bad)g.d++;else if(hold)g.h++;const c=p.chargerType||"—";g.ct[c]=(g.ct[c]||0)+1})});
 return {rows:[...m.values()].sort((a,b)=>b.n-a.n||String(a.k).localeCompare(String(b.k))),ct}}
function partsTbl(all,key,title,icon){const {rows,ct}=partStats(all,key),used=rows.filter(r=>r.n>0),show=PU[key]?rows:used,sum=used.reduce((a,r)=>a+r.n,0),mx=Math.max(1,...rows.map(r=>r.n)),isE=key==="elecParts";
 const sp=k=>{const i=String(k).indexOf(" — ");return i>=0?[String(k).slice(0,i),String(k).slice(i+3)]:[String(k),""]};
 return `<div class="sec"><h2>${icon} ${esc(title)} — Usage & Repair Result</h2>
  <p class="note">${used.length} of ${rows.length} parts used · ${sum} total uses in ${all.length} entries (filters applied). Repaired = Charger Repaired · Hold = Hold for Part · Dead = Dead. One entry counts once per part.</p>
  <div class="tw"><table><thead><tr><th>#</th><th>Part</th>${isE?"<th>Position / Sub Part</th>":""}<th>Used</th><th>Share</th><th></th><th>Repaired</th><th>Hold</th><th>Dead</th><th>Repair %</th>${ct.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>
  ${show.map((r,i)=>{const [a,b]=isE?sp(r.k):[r.k,""];return `<tr><td>${i+1}</td><td class="w"><b>${esc(a)}</b></td>${isE?`<td class="w">${esc(b)}</td>`:""}<td><b>${r.n}</b></td><td>${pct(r.n,all.length)}%</td><td style="width:120px"><div class="bar"><i style="width:${pct(r.n,mx)}%"></i></div></td><td style="color:#16a34a;font-weight:700">${r.r}</td><td style="color:#d97706;font-weight:700">${r.h}</td><td style="color:#dc2626;font-weight:700">${r.d}</td><td>${r.n?pct(r.r,r.n)+"%":"—"}</td>${ct.map(c=>`<td>${r.ct[c]||0}</td>`).join("")}</tr>`}).join("")||`<tr><td colspan="${9+(isE?1:0)+ct.length}">No parts used yet</td></tr>`}</tbody></table></div>
  ${rows.length>used.length?`<div class="row" style="margin-top:10px"><button class="gry" data-a="pu" data-i="${key}">${PU[key]?"Hide unused parts":"Show unused parts too ("+(rows.length-used.length)+")"}</button></div>`:""}</div>`}
function partsDash(all){return partsTbl(all,"mechParts","Mechanical Parts","🔩")+partsTbl(all,"elecParts","Electrical Parts","⚡")}
const winSel=k=>`<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label style="margin:0">Data loaded</label><select data-win="1" style="width:auto;margin:0;flex:0 0 auto;min-width:170px">${WINS.map(([d,l])=>`<option value="${d}" ${WIN[k]===d?"selected":""}>${l}</option>`).join("")}</select></span>`;
function dash(){const k=dm,s=S[k],B=BASE[k],all=applyF(k,s.rows,false),n=all.length,fl=all.filter(isFail).length,ok=all.filter(isOk).length,pend=n-fl-ok;
 const stat=group(all,p=>p[B.stat]),byUser=group(all,p=>p.createdByName||"Unknown"),dimF=[...fieldsOf(k).filter(x=>x[2]==="sel"||x[2]==="multi").map(x=>[x[0],x[1]]),["__by","Added By"]];
 if(!dimF.some(x=>x[0]===DIM[k]))DIM[k]=dimF[0][0];

 let acc=0;const seg=stat.map((x,i)=>{const a=acc/n*360;acc+=x.n;return `${PAL[i%8]} ${a}deg ${acc/n*360}deg`}).join(",");
 return `<div class="row"><div class="tabs" style="margin:0"><button class="${k==="battery"?"on":""}" data-a="dm" data-i="battery">🔋 ${esc(BASE.battery.title)}</button><button class="${k==="charger"?"on":""}" data-a="dm" data-i="charger">⚡ ${esc(BASE.charger.title)}</button><button class="${k==="lucknow"?"on":""}" data-a="dm" data-i="lucknow">🏭 ${esc(BASE.lucknow.title)}</button></div>
  <span style="flex:1"></span><small style="color:var(--mut)">Updated ${lastLoad?new Date(lastLoad).toLocaleTimeString():"…"} · ${s.rows.length} entries loaded</small>

 <div class="sec"><h2>Filters</h2>${fbar(k,false)}<p class="note">Failure = Repair Status of Not OK / Non-Repairable / Scrap / Dead, or PDI Fail. Resolved = Repair Status OK / Repaired / No Issue Found. Filters apply to every chart below. For parts columns, one entry is counted once under each part used.</p></div>
 ${s.loaded?"":`<div class="sec">Loading data…</div>`}
 <div class="cards">${kpi("Total Entries",n)}${kpi("Resolved",ok,"g2")}${kpi("Failed",fl,"r2")}${kpi("In Process / On Hold",pend,"o2")}${kpi("Failure Rate",pct(fl,n)+"%","r2")}${kpi("Success Rate",pct(ok,n)+"%","g2")}
  ${k==="battery"?kpi("PDI Pass",pdiP,"g2")+kpi("PDI Fail",pdiF,"r2"):""}${k==="lucknow"?kpi("Mechanical Issue",all.filter(p=>/mech/i.test(p.reportedIssue||"")).length)+kpi("Electrical Issue",all.filter(p=>/elec/i.test(p.reportedIssue||"")).length)+kpi("Mechanical Parts Used",all.reduce((a,p)=>a+asArr(p.mechParts).length,0))+kpi("Electrical Parts Used",all.reduce((a,p)=>a+asArr(p.elecParts).length,0)):""}${kpi("Active Contributors",byUser.length)}${isAdmin()?kpi("Total Users",users.filter(u=>u.role==="user").length)+kpi("Total Admins",users.filter(u=>u.role!=="user").length):""}</div>

function bkSec(){return `<div class="sec"><h2>Owner Backup — Export all data</h2><p class="note">Visible only to the Owner. Each module is stored in its own Firestore collection (${Object.keys(BASE).map(k=>BASE[k].col).join(", ")}) so data never mixes. Backup reads every entry once (1 read per entry; free limit is 50,000 reads/day). For very large data, download one module CSV at a time.</p>
 <div class="row"><button data-a="bkj">⬇ Full Backup (JSON: all modules + settings + users)</button>${Object.keys(BASE).map(k=>`<button class="grn" data-a="bkc" data-i="${k}">⬇ ${esc(BASE[k].title)} CSV (all)</button>`).join("")}</div><p class="note" id="bkst"></p></div>`}
const ser=v=>{if(v&&typeof v.toDate==="function")return v.toDate().toISOString();if(Array.isArray(v))return v.map(ser);if(v&&typeof v==="object"){const o={};for(const k in v)o[k]=ser(v[k]);return o}return v};
async function pageAll(col,cb,label){let cur=null,n=0;const st=$("#bkst");for(;;){const qs=await getDocs(query(collection(db,col),...(cur?[startAfter(cur)]:[]),limit(1000)));if(!qs.docs.length)break;
  cb(qs.docs.map(d=>({id:d.id,...d.data()})));n+=qs.docs.length;cur=qs.docs[qs.docs.length-1];if(st)st.textContent=(label||col)+": "+n.toLocaleString()+" entries read…";if(qs.docs.length<1000)break}return n}
const dl=(parts,name,type)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(parts,{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000)};

function formModal(k,p,title,onSave){const F=fieldsOf(k),m=$("#modal"),v={...(p||{})};
 if(!p){const d=today();if(k==="battery")v.ticketDate=d;else if(k==="lucknow"){v.repairDate=d;v.repairLocation="Lucknow"}else{v.openDate=d;v.repairLocation="Bangalore CSC"}}
 m.innerHTML=`<div class="box"><h2 style="margin-bottom:10px;color:var(--acc)">${esc(title)}</h2>
 <div class="who">👤 ${p?`Added by <b>${esc(p.createdByName||"—")}</b> on ${tm(p.createdAt)}. Your name (<b>${esc(me.name)}</b>) will be recorded as "Last Updated By".`:`This entry will be saved under <b>${esc(me.name)}</b> (${esc(me.role)}).`}<br><small>All fields are optional. The date defaults to today and can be changed.</small></div>
 <div class="g">${F.map(([key,l,t])=>{
  if(t==="sel"){const o=optsOf(k,key),ops=[...o];if(v[key]&&!ops.includes(v[key]))ops.push(v[key]);
   return `<div><label>${esc(l)}</label><select id="f_${key}" data-sel="${key}"><option value="">— Select —</option>${ops.map(x=>`<option ${v[key]===x?"selected":""}>${esc(x)}</option>`).join("")}</select>${o.some(isOther)?`<input id="f_${key}Other" placeholder="Specify details…" value="${esc(v[key+"Other"]||"")}" class="${isOther(v[key])?"":"hide"}">`:""}</div>`}
  if(t==="multi"){const o=optsOf(k,key),sel=asArr(v[key]),ops=[...o];sel.forEach(x=>{if(!ops.includes(x))ops.push(x)});
   return `<div style="grid-column:1/-1"><label>${esc(l)} <span class="msn" id="n_${key}">${sel.length} selected</span></label><input class="msq" data-q="${key}" placeholder="Search…" style="margin-bottom:6px"><div class="ms" id="f_${key}">${ops.map(x=>`<label class="mi"><input type="checkbox" data-v="${esc(x)}" ${sel.includes(x)?"checked":""}><span>${esc(x)}</span></label>`).join("")||"<small style='color:var(--mut)'>No options yet. Add them in Admin Settings.</small>"}</div></div>`}
  if(t==="area")return `<div style="grid-column:1/-1"><label>${esc(l)}</label><textarea id="f_${key}">${esc(v[key]||"")}</textarea></div>`;
  return `<div><label>${esc(l)}</label><input id="f_${key}" type="${t}" value="${esc(v[key]||"")}"></div>`}).join("")}</div>
 <div class="row" style="margin-top:14px"><button id="ps">Save Entry</button><button class="gry" id="pc">Cancel</button></div></div>`;
 m.classList.remove("hide");
 m.onchange=e=>{const key=e.target.dataset?.sel,o=key&&$("#f_"+key+"Other");if(o)o.classList.toggle("hide",!isOther(e.target.value));
  const ms=e.target.closest&&e.target.closest(".ms");if(ms){const nn=$("#n_"+ms.id.slice(2));if(nn)nn.textContent=ms.querySelectorAll("input:checked").length+" selected"}};
 m.oninput=e=>{const q=e.target.dataset?.q;if(!q)return;const s=e.target.value.toLowerCase();document.querySelectorAll("#f_"+q+" .mi").forEach(x=>x.classList.toggle("hide",!x.textContent.toLowerCase().includes(s)))};
 $("#pc").onclick=()=>m.classList.add("hide");
 $("#ps").onclick=async()=>{const d={};
  F.forEach(([key,,t])=>{const el=$("#f_"+key);
   if(t==="multi"){d[key]=el?[...el.querySelectorAll("input:checked")].map(c=>c.dataset.v):[];return}
   d[key]=el?el.value.trim():"";
   if(t==="sel"){const ot=$("#f_"+key+"Other"),nv=ot&&isOther(d[key])?ot.value.trim():"";if(nv||(p&&p[key+"Other"]))d[key+"Other"]=nv}});
  $("#ps").disabled=true;
  try{await onSave(d);m.classList.add("hide");toast("Entry saved successfully")}catch(e){fail(e);$("#ps").disabled=false}}}

  dolder:()=>loadMod(dm,true,FETCH),
  cnt:async()=>{const k=curMod();try{const r=await getCountFromServer(collection(db,BASE[k].col));toast(BASE[k].title+": "+r.data().count.toLocaleString()+" entries in database")}catch(e){fail(e)}},
  cr:i=>{const a=[...(cfg.custom[stm]||[])],n=prompt("Rename column:",a[i].label);if(!n||!n.trim())return;const old=a[i].label;a[i]={...a[i],label:n.trim()};saveFields(stm,a,"renamed "+old+" → "+n.trim())},
  sb:async()=>{const g=id=>($("#"+id)?.value||"").trim(),o={app:g("br_app"),sub:g("br_sub"),wheel:g("br_wheel"),dashTitle:g("br_dash"),nav:{},mod:{},steps:[],fl:{...(BR.fl||{})}};
   for(const k in DEF_BR.nav)o.nav[k]=g("br_nav_"+k);for(const k in DEF_BR.mod)o.mod[k]=g("br_mod_"+k);DEF_BR.steps.forEach((_,i)=>o.steps.push({t:g("br_st_t"+i),d:g("br_st_d"+i)}));
   const fl={};BASE[stm].fields.forEach(f=>{const v=g("bf_"+f[0]);if(v&&v!==f[1])fl[f[0]]=v.slice(0,60)});o.fl[stm]=fl;
   try{await withTO(setDoc(doc(db,"config","branding"),o));BR=mergeBR(o);try{localStorage.setItem("brand",JSON.stringify(o))}catch(_){}applyBrand();nav("set");toast("Names & labels saved");log("Updated CRM names & labels","")}catch(e){fail(e)}},
  sr:async()=>{if(!confirm("Reset ALL names and labels to default?"))return;try{await setDoc(doc(db,"config","branding"),{});BR=mergeBR({});try{localStorage.removeItem("brand")}catch(_){}applyBrand();nav("set");toast("Reset to default");log("Reset CRM names & labels","")}catch(e){fail(e)}},
  bkj:async()=>{if(!isOwner())return;if(!confirm("Backup reads every entry once (1 read per entry). Continue?"))return;const st=$("#bkst"),parts=[];let first=true;
   try{parts.push('{"exportedAt":'+JSON.stringify(new Date().toISOString())+',"app":'+JSON.stringify(BR.app)+',"modules":{');
    for(const k of Object.keys(BASE)){parts.push((first?"":",")+JSON.stringify(k)+':{"collection":'+JSON.stringify(BASE[k].col)+',"title":'+JSON.stringify(BASE[k].title)+',"columns":'+JSON.stringify(fieldsOf(k).map(f=>({key:f[0],label:f[1]})))+',"rows":[');first=false;let f2=true;
     await pageAll(BASE[k].col,rows=>{parts.push((f2?"":",")+rows.map(r=>JSON.stringify(ser(r))).join(","));f2=false},BASE[k].title);parts.push("]}")}
    parts.push('},"config":{');const cf=[];for(const id of["options","fields","permissions","branding"]){try{const s=await getDoc(doc(db,"config",id));cf.push(JSON.stringify(id)+":"+JSON.stringify(s.exists()?ser(s.data()):{}))}catch(_){cf.push(JSON.stringify(id)+":{}")}}
    parts.push(cf.join(",")+'},"users":'+JSON.stringify(ser(users.map(u=>({...u}))))+"}");
    dl(parts,"crm_backup_"+today()+".json","application/json");if(st)st.textContent="Backup downloaded.";log("Owner full backup (JSON)","")}catch(e){if(st)st.textContent="Backup failed: "+(e.code||e.message);fail(e)}},
  bkc:async k=>{if(!isOwner())return;if(!confirm("Export reads every entry once (1 read per entry). Continue?"))return;const F=fieldsOf(k),qt=v=>`"${String(v??"").replace(/"/g,'""')}"`,st=$("#bkst");let n=0;
   const parts=["\ufeff"+[['"Sr. No."','"Document ID"',...F.map(f=>qt(f[1])),'"Added By"','"Added On"','"Last Updated By"'].join(",")]+"\n"];
   try{await pageAll(BASE[k].col,rows=>{parts.push(rows.map(p=>[++n,qt(p.id),...F.map(f=>qt(cell(k,p,f))),qt(p.createdByName),qt(tm(p.createdAt)),qt(p.updatedByName)].join(",")).join("\n")+"\n")},BASE[k].title);
    dl(parts,BASE[k].col+"_ALL_"+today()+".csv","text/csv");if(st)st.textContent=BASE[k].title+": "+n.toLocaleString()+" rows exported.";log("Owner backup CSV",BASE[k].title+" ("+n+" rows)")}catch(e){if(st)st.textContent="Export failed: "+(e.code||e.message);fail(e)}},
 sp:async()=>{const p={};["userAdd","userEdit","userExport","userLog"].forEach(id=>p[id]=$("#"+id).checked);try{await setDoc(doc(db,"config","permissions"),p);cfg.perm=p;toast("Permissions saved");log("Updated user permissions",JSON.stringify(p));$("#navlog").classList.toggle("hide",!can("userLog"))}catch(e){fail(e)}},
 oa:i=>{const v=$("#no_"+i).value.trim();if(!v)return;const a=[...optsOf(stm,i)];if(a.includes(v))return toast("Option already exists.");a.push(v);saveOpts(stm,i,a,"added "+v)},
 oe:(i,b)=>{const f=b.dataset.f,a=[...optsOf(stm,f)],n=prompt("Rename option:",a[i]);if(!n||!n.trim()||n.trim()===a[i])return;const old=a[i];a[i]=n.trim();saveOpts(stm,f,a,old+" → "+a[i])},
 od:(i,b)=>{const f=b.dataset.f,a=[...optsOf(stm,f)];if(!confirm('Delete option "'+a[i]+'"?'))return;const old=a.splice(i,1)[0];saveOpts(stm,f,a,"deleted "+old)},
 ca:()=>{const label=$("#cn").value.trim(),type=$("#ct").value;if(!label)return toast("Enter a column name.");const a=[...(cfg.custom[stm]||[])];
  const key="x_"+label.toLowerCase().replace(/[^a-z0-9]+/g,"_").slice(0,24)+"_"+Math.random().toString(36).slice(2,5);a.push({key,label,type});saveFields(stm,a,"added "+label)},
 cd:i=>{const a=[...(cfg.custom[stm]||[])];if(!confirm('Remove column "'+a[i].label+'"? Stored data is kept.'))return;const old=a.splice(i,1)[0];saveFields(stm,a,"removed "+old.label)}
};
const V=$("#view");
V.onclick=e=>{const b=e.target.closest("[data-a]");if(b&&H[b.dataset.a])H[b.dataset.a](b.dataset.i,b)};
V.onchange=e=>{const t=e.target;
 if(t.dataset.win!==undefined){const k=curMod(),v=+t.value;WIN[k]=v;try{localStorage.setItem("win_"+k,v)}catch(_){}Object.assign(S[k],{rows:[],cur:null,more:false,loaded:false,full:false});SHOW[k]=20;render();loadMod(k,false,k===view?20:FETCH)}
 else if(t.dataset.f){const f=FL[curMod()];f[t.dataset.f]=t.value;if(t.dataset.f==="col")f.val="";render()}
 else if(t.dataset.dim){DIM[dm]=t.value;DALL[dm]=false;render()}
 else if(t.dataset.c==="ro"){updateDoc(doc(db,"users",t.dataset.i),{role:t.value}).then(()=>{const u=users.find(x=>x.id===t.dataset.i);if(u){u.role=t.value;log("Changed role",u.name+" → "+t.value)}}).catch(fail)}};
V.oninput=e=>{const t=e.target;if(t.id==="fq"){FL[curMod()].q=t.value;SHOW[curMod()]=20;const p=t.selectionStart;render();const n=$("#fq");n.focus();n.setSelectionRange(p,p)}};
</script></body></html>
