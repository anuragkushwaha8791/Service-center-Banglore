[data-theme=dark] .dlg{border:1px solid var(--line)}
#view.vin{animation:vin .32s ease both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#view.vin .c{animation:cin .45s both}
#view.vin .cards .c:nth-child(2){animation-delay:.04s}#view.vin .cards .c:nth-child(3){animation-delay:.08s}#view.vin .cards .c:nth-child(4){animation-delay:.12s}
#view.vin .cards .c:nth-child(5){animation-delay:.16s}#view.vin .cards .c:nth-child(6){animation-delay:.2s}#view.vin .cards .c:nth-child(n+7){animation-delay:.24s}
@keyframes cin{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
#view.vin .bar i{transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#view.vin .tw tbody tr{animation:rin .3s both}
#view.vin .tw tbody tr:nth-child(2){animation-delay:.03s}#view.vin .tw tbody tr:nth-child(3){animation-delay:.06s}#view.vin .tw tbody tr:nth-child(4){animation-delay:.09s}
#view.vin .tw tbody tr:nth-child(5){animation-delay:.12s}#view.vin .tw tbody tr:nth-child(n+6){animation-delay:.15s}
@keyframes rin{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
#modal:not(.hide){animation:fadein .15s both}#modal:not(.hide) .box{animation:pop .2s both}
.side a{transition:background .15s,color .15s,transform .15s}.side a:hover{transform:translateX(2px)}
.side a:focus-visible,button:focus-visible{outline:2px solid #f59e0b;outline-offset:2px}
.skel .sk{display:block;height:14px;border-radius:7px;margin:10px 0;background:linear-gradient(90deg,var(--soft) 25%,var(--line) 37%,var(--soft) 63%);background-size:400% 100%;animation:shim 1.3s ease infinite}
.skel .sk.w40{width:40%}.skel .sk.w30{width:30%}.skel .sk.w70{width:70%}.skel .sk.h28{height:28px;width:55%}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
.lnk{background:transparent!important;box-shadow:none!important;border:none!important;color:var(--acc2);padding:6px 4px}
.lnk:hover{text-decoration:underline;filter:none}
